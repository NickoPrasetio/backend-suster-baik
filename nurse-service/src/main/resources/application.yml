server:
  port: 8082

spring:
  application:
    name: nurse-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nurse_db}
    username: ${SPRING_DATASOURCE_USERNAME:susterku}
    password: ${SPRING_DATASOURCE_PASSWORD:susterku123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
