server:
  port: 8082

spring:
  application:
    name: nurse-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nurse_db}
    username: ${SPRING_DATASOURCE_USERNAME:susterku}
    password: ${SPRING_DATASOURCE_PASSWORD:susterku123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: nurse-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.susterku.nurse.kafka"
        spring.json.value.default.type: "com.susterku.nurse.kafka.RatingUpdateEvent"
