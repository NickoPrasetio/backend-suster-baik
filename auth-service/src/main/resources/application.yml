server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:tukangku}
    password: ${SPRING_DATASOURCE_PASSWORD:tukangku123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET:tukangku-super-secret-jwt-key-min-32-chars-2024}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:tukangku}
  secret-key: ${MINIO_SECRET_KEY:tukangku123}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
