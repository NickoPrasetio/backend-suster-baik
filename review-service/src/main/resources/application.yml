server:
  port: 8083

spring:
  application:
    name: review-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/review_db}
    username: ${SPRING_DATASOURCE_USERNAME:susterku}
    password: ${SPRING_DATASOURCE_PASSWORD:susterku123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

nurse:
  service:
    url: ${NURSE_SERVICE_URL:http://localhost:8082}
