services:
  minio:
    image: minio/minio:latest
    container_name: tukangku-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: tukangku
      MINIO_ROOT_PASSWORD: tukangku123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tukangku-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: tukangku-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tukangku-network

  postgres:
    image: postgres:16-alpine
    container_name: tukangku-postgres
    environment:
      POSTGRES_USER: tukangku
      POSTGRES_PASSWORD: tukangku123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tukangku -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tukangku-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tukangku-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: tukangku
      SPRING_DATASOURCE_PASSWORD: tukangku123
      JWT_SECRET: tukangku-super-secret-jwt-key-min-32-chars-2024
      JWT_EXPIRATION_MS: 86400000
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: tukangku
      MINIO_SECRET_KEY: tukangku123
      MINIO_PUBLIC_URL: http://localhost:9000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tukangku-network

  nurse-service:
    build:
      context: ./nurse-service
      dockerfile: Dockerfile
    container_name: tukangku-worker
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/worker_db
      SPRING_DATASOURCE_USERNAME: tukangku
      SPRING_DATASOURCE_PASSWORD: tukangku123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: tukangku
      MINIO_SECRET_KEY: tukangku123
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tukangku-network

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: tukangku-review
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review_db
      SPRING_DATASOURCE_USERNAME: tukangku
      SPRING_DATASOURCE_PASSWORD: tukangku123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: tukangku
      MINIO_SECRET_KEY: tukangku123
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tukangku-network

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: tukangku-booking
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: tukangku
      SPRING_DATASOURCE_PASSWORD: tukangku123
      WORKER_SERVICE_URL: http://nurse-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      nurse-service:
        condition: service_started
    networks:
      - tukangku-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: tukangku-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      WORKER_SERVICE_URL: http://nurse-service:8082
      REVIEW_SERVICE_URL: http://review-service:8083
      BOOKING_SERVICE_URL: http://booking-service:8084
      JWT_SECRET: tukangku-super-secret-jwt-key-min-32-chars-2024
    depends_on:
      - auth-service
      - nurse-service
      - review-service
      - booking-service
    networks:
      - tukangku-network

networks:
  tukangku-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
